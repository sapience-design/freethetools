version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro: { patterns: ["astro", "@astrojs/*"] }
      dev: { dependency-type: development }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # One pull request a week for every action. The github/codeql-action steps (init, analyze,
    # upload-sarif) must share one version, or CodeQL fails: separate bumps can never pass.
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
