name: All pages

# The page-by-page browser tests (axe-core and reflow) on every page in every language.
# Pull requests test every English page and a sample per language (e2e/pages.js), so a change
# that breaks one translated page is caught here within a day. Runs daily and on demand.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-pages:
    name: Every page in every language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests on every page (desktop and phone)
        run: npx playwright test e2e/a11y.spec.js e2e/a11y-manual.spec.js
        env: { CI: "true", FTT_ALL_PAGES: "1" }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-report-all-pages, path: test-results/, retention-days: 7 }
