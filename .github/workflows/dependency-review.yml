name: Dependency review

# Blocks a pull request that adds or updates a dependency with a known vulnerability of moderate
# severity or worse. New tools often bring a library, so this runs on every pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: New dependencies have no known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
