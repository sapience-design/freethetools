name: DCO

# Every commit in a pull request must carry a Signed-off-by line matching its author
# (Developer Certificate of Origin, https://developercertificate.org). See CONTRIBUTING.md.
# Dependabot's own commits are the one exception: they change version numbers, not code, so
# there is nothing for a bot to certify. A commit anyone adds to its branch still needs a sign-off.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            # Both must hold: no person can open a pull request as dependabot[bot], and the commit
            # itself must be Dependabot's, so nobody can skip the check by borrowing its address.
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$email" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              echo "Skipped $(git log -1 --format='%h %s' "$sha"): written by Dependabot."
              continue
            fi
            # Compare the address literally: emails contain regex characters such as + and .
            if ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by: ' | grep -qF "<${email}>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by for $email"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
