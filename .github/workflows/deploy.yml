name: Deploy

# Publishes to Cloudflare Workers (static assets): main -> freethetools.com, pull requests from
# branches in this repo -> a preview URL. Needs repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (docs/how-to/deploy.md). Forks can't read secrets, so they aren't previewed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.publish.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test && npm run test:site
      - name: Publish
        id: publish
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "push" ]; then
            npx wrangler deploy | tee deploy.log
            echo "url=https://freethetools.com" >> "$GITHUB_OUTPUT"
          else
            npx wrangler versions upload --preview-alias "pr-$PR" | tee deploy.log
            url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' deploy.log | tail -1)
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
          echo "Published: $(grep -oE 'https://[^ ]+' deploy.log | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run built and tested but did not deploy."
