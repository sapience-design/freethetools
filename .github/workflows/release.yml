name: Release

# When a release pull request merges (`npm run release`), the version in package.json changes on
# main. This tags that commit vX.Y.Z and publishes a GitHub Release with the version's notes from
# CHANGELOG.md. It acts only when the push changed the version, and never releases a version
# twice, so other package.json changes do nothing. Needs no secrets. See docs/how-to/release.md.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish it, once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push that changes the version is a release. (Without this, the first push after
          # this workflow arrived released the old version on the wrong commit.)
          was=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BEFORE" --jq .content | base64 -d | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$was" = "$VERSION" ]; then
            echo "The version is still $VERSION; nothing to release."
            exit 0
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          node scripts/changelog.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
