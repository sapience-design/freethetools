name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and test the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build (validates every tool.json)
        run: npm run build
      - name: Tool unit tests
        run: npm test
      - name: Built-site checks
        run: npm run test:site
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and phone)
        run: npm run test:e2e
        env: { CI: "true" }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  package:
    name: Package for AI agents (${{ matrix.os }})
    # The freethetools npm package (MCP server and command line). Kept apart from the site job
    # and from npm test, so production deploys never depend on it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/freethetools/package-lock.json
      - run: npm ci
      - name: Build and test the package
        run: npm run test:package
      - name: Check the published package has its files
        # dist/ is not in git: the package's prepack script builds it. An empty package would install and do nothing.
        run: node scripts/check-pack.mjs

  python:
    name: Command-line versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tools
